<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca</title>
</head>
<body>

<h1>Minha Biblioteca</h1>

<h2>Cadastrar Livro</h2>

<form>
    <label>Título:</label>
    <input type="text" id="titulo" placeholder="Nome do livro">

    <br><br>

    <label>Autor:</label>
    <input type="text" id="autor" placeholder="Nome do autor">

    <br><br>

    <label>Ano de publicação:</label>
    <input type="number" id="ano" placeholder="Ano">

    <br><br>

    <label>Editora:</label>
    <input type="text" id="editora" placeholder="Nome da editora">

    <br><br>

    <button type="submit">Cadastrar livro</button>
</form>

<hr>

<h2>Livros cadastrados</h2>

<button>Listar livros</button>

<ul id="lista-livros">
    <!-- Os livros aparecerão aqui -->
</ul>

</body>
</html>
